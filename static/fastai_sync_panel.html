<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发送账号</title><link rel="stylesheet" href="/static/auto_registration.css"><style>input[type=url]{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:inherit}dialog{width:min(900px,92vw);max-height:85vh;overflow:auto}dialog table{width:100%}.logs .log{grid-template-columns:135px 1fr}.detail-error{white-space:normal;word-break:break-word}.history-panel button{white-space:nowrap}</style></head><body class="embedded"><main>
<header><div><div class="eyebrow">AUTOMATION / FASTAI</div><h1>发送账号</h1><p class="muted">将邮箱和收件链接发送到 FastAI。</p></div></header>
<section class="overview"><div><span class="eyebrow">运行状态</span><strong id="status">正在连接</strong><small id="progress">读取后台状态…</small></div><div><span class="eyebrow">下次启动倒计时</span><strong class="countdown" id="countdown">—</strong><small id="nextAt">—</small></div><div><span class="eyebrow">待同步 / 最近一轮</span><strong id="pending">—</strong><small id="lastResult">尚无任务记录</small></div></section>
<div class="columns"><section class="panel"><div class="panel-title"><h2>任务配置</h2><label class="switch"><input id="enabled" type="checkbox" role="switch" aria-label="自动同步开关"><span></span><b id="switchLabel">已关闭</b></label></div>
<form id="configForm"><label>接口地址<input id="apiUrl" type="url" required placeholder="http://127.0.0.1:8766/api/import"><small>填写服务根地址时自动补充 /api/import。</small></label><div class="field-row"><label>每轮数量<input id="batchSize" type="number" min="1" max="10000" required><small>每轮最多发送 1–10000 个。</small></label><label>执行间隔（分钟）<input id="interval" type="number" min="1" max="10080" required><small>本轮结束后计算下一轮时间。</small></label></div>
<label class="switch"><input id="includeSynced" type="checkbox" role="switch" aria-label="包含已同步"><span></span><b>包含已同步</b></label><p class="hint">默认关闭，只发送未同步账号。开启后，也会再次发送已同步账号。保存不重置下次时间。</p><div class="actions"><button id="save" class="primary" type="submit">保存配置</button><button id="run" type="button">立即执行一轮</button></div><p id="formMessage" class="message" role="status"></p></form></section>
<section class="panel logs-panel"><div class="panel-title"><h2>同步日志</h2><span class="live"><i></i> 后台同步</span></div><div id="logs" class="logs" role="log" aria-label="同步日志"></div><div class="log-foot">最近 300 条 · 最新在上 · 刷新后保留 · 每 2 秒同步</div></section></div>
<section class="panel history-panel"><div class="panel-title"><h2>同步任务记录</h2><button id="refresh" type="button">刷新</button></div><div class="table-wrap"><table><thead><tr><th>开始时间 / 任务</th><th>触发方式</th><th>提交数量</th><th>进度</th><th>成功 / 失败</th><th>状态</th><th>结果</th></tr></thead><tbody id="history"></tbody></table></div></section><footer>仅确认导入成功的邮箱会标记为已同步。接口连接或权限异常时停止本轮，未处理邮箱保留待同步状态。</footer>
</main><dialog id="details"><div class="panel-title"><h2>同步结果</h2><button id="closeDetails" type="button">关闭</button></div><p id="detailSummary"></p><div class="table-wrap"><table><thead><tr><th>邮箱</th><th>状态</th><th>结果 / 错误</th></tr></thead><tbody id="detailItems"></tbody></table></div></dialog><script src="/static/fastai_sync_panel.js"></script></body></html>
