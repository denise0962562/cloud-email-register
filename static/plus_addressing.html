<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分裂地址验证 · iCloud HME</title><link rel="stylesheet" href="/static/plus_addressing.css"><script src="/static/plus_addressing.js" defer></script></head>
<body><main><a href="/">← 返回账号管理</a><h1>分裂地址验证</h1>
<p>为已有隐私地址添加后缀，并用真实邮件验证收信。是否可用以本次实收结果为准。</p>
<section><h2>对照测试</h2><form id="form">
<label>发件 iCloud 账号<select id="sender" required></select></label>
<label>源地址（选择 1–3 个）<select id="bases" multiple size="7" required></select></label>
<label>加号后缀（1–3 个，逗号分隔）<input id="tags" value="test01" maxlength="80" required autocomplete="off"></label>
<label>等待收信（秒）<input id="timeout" type="number" min="30" max="300" value="120" required></label>
<p class="note">开始后会为分裂地址生成单独链接，复用源地址的收件箱，并向每个源地址及分裂地址各发一封邮件。同一源地址及其所有后缀共用邮件，链接之间不隔离。停止或超时后保留收件配置供重试；不会自动重发结果未知的邮件。</p>
<div class="actions"><button id="start" type="submit">配置并发送对照邮件</button><button id="refresh" type="button">刷新账号与源地址</button><button id="cancel" type="button" disabled>停止测试</button></div>
</form><p id="status" role="status" aria-live="polite">正在读取本地配置…</p></section>
<section><h2>本次结果</h2><p>“发信已接受”只表示发送请求成功；“等待结束，未观察到”不能单独证明苹果不支持分裂地址。只有实际收到对应加号测试邮件才会出现在导出清单；各后缀与源地址共用收件箱。</p>
<div class="table-wrap"><table><thead><tr><th>收件地址</th><th>类型</th><th>发信</th><th>收信</th></tr></thead><tbody id="rows"><tr><td colspan="4">尚未开始测试</td></tr></tbody></table></div>
<label>验证成功的邮箱与收件链接<textarea id="output" rows="5" readonly></textarea></label><div class="actions"><button id="copy" type="button" disabled>复制已验证结果</button><a id="download" hidden>下载 TXT</a></div>
</section></main></body></html>
