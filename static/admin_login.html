<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员登录 · iCloud HME</title><link rel="stylesheet" href="/static/admin.css"></head><body><main class="login"><div class="eyebrow">ICLOUD HME / ADMIN</div><h1>管理员登录</h1><p class="muted">登录后管理邮箱、账号与后台任务。会话默认有效 30 天。</p><form id="login"><label for="username">管理员账号</label><input id="username" autocomplete="username" maxlength="64" required autofocus><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" maxlength="256" required><button id="submit">登录管理后台</button><p id="error" class="error" role="alert"></p></form></main><script>
document.querySelector('#login').addEventListener('submit',async event=>{event.preventDefault();const button=document.querySelector('#submit'),error=document.querySelector('#error');button.disabled=true;error.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'登录失败');location.assign('/');}catch(e){error.textContent=e.message;}finally{button.disabled=false;}});
</script></body></html>
